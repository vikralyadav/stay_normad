version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: nomad-postgres

    environment:
      POSTGRES_DB: nomadstay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: nomadstay-backend

    ports:
      - "9090:8080"

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - postgres